<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Motion Arcade — Display</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="arcade-wrap">
  <h1 class="glow-title" id="gameTitle">MOTION ARCADE</h1>

  <div id="lobby" class="panel">
    <p class="hint">Room code — enter this on each phone at <b id="joinUrl"></b></p>
    <div class="code-display" id="roomCode">----</div>
    <div class="stack" style="margin-top:18px;">
      <p class="hint"><span class="status-dot" id="p1dot"></span>Player 1: <span id="p1status">waiting…</span></p>
      <p class="hint"><span class="status-dot" id="p2dot"></span>Player 2: <span id="p2status">optional</span></p>
    </div>
    <div class="row" style="margin-top:20px;">
      <button id="startSoloBtn" class="btn-outline" disabled>Start Solo (vs CPU)</button>
      <button id="startDuoBtn" disabled>Start 2-Player</button>
    </div>
  </div>

  <div class="game-stage" id="gameStage" style="display:none;">
    <div class="hud">
      <span class="score" id="score1">P1: 0</span>
      <span id="gameLabel" class="pixel" style="font-size:12px; color:var(--muted);"></span>
      <span class="score p2" id="score2">P2: 0</span>
    </div>
    <canvas id="canvas" width="900" height="560"></canvas>
    <div class="overlay-msg" id="overlay" style="display:none;">
      <h2 class="glow-title" id="overlayTitle" style="font-size:22px;"></h2>
      <p class="hint" id="overlaySub"></p>
      <button id="restartBtn" style="max-width:220px;">Play Again</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/games/tennis.js"></script>
<script src="js/games/racing.js"></script>
<script src="js/games/sword.js"></script>
<script src="js/games/bowling.js"></script>
<script src="js/games/fruit.js"></script>
<script src="js/games/airhockey.js"></script>
<script src="js/games/balance.js"></script>
<script src="js/display.js"></script>
</body>
</html>
